<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>من أجل من أهوى ❤️</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffefef;
            font-family: "Cairo", "Poppins", sans-serif;
            overflow: hidden;
            text-align: center;
        }

        .container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            z-index: 10;
        }

        h1 {
            font-size: 38px;
            color: #d6336c;
            animation: fadeIn 2s ease-in-out;
            margin-bottom: 10px;
        }

        p {
            font-size: 20px;
            color: #444;
            max-width: 650px;
            margin: 15px auto;
            opacity: 0;
            animation: fadeIn 4s forwards;
            line-height: 1.6;
        }

        /* تأخير ظهور الجمل لتعطي تدريجاً رومانسياً */
        .container p:nth-of-type(1) { animation-delay: 1s; }
        .container p:nth-of-type(2) { animation-delay: 3s; }
        .container p:nth-of-type(3) { animation-delay: 5s; }
        .container p:nth-of-type(4) { animation-delay: 7s; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* قلوب الخلفية العائمة */
        .hearts {
            position: fixed;
            width: 100%;
            height: 100%;
            pointer-events: none;
            top: 0;
            left: 0;
            overflow: hidden;
            z-index: 1;
        }

        .heart {
            position: absolute;
            width: 20px;
            height: 20px;
            background: #ff758c;
            transform: rotate(45deg);
            animation: float 5s infinite ease-in;
            opacity: 0.7;
        }

        .heart::before, .heart::after {
            content: "";
            position: absolute;
            width: 20px;
            height: 20px;
            background: #ff758c;
            border-radius: 50%;
        }

        .heart::before { top: -10px; left: 0; }
        .heart::after  { left: -10px; top: 0; }

        @keyframes float {
            0% { transform: translateY(100vh) rotate(45deg); opacity: 0; }
            50% { opacity: 0.8; }
            100% { transform: translateY(-10vh) rotate(45deg); opacity: 0; }
        }
    </style>
</head>
<body>

    <!-- موسيقى هادئة ورومانسية في الخلفية -->
    <audio autoplay loop>
        <source src="https://raw.githubusercontent.com/Lovely1010/Music/main/Agar%20Tum%20Saath%20Ho%20-%20Instrumental.mp3" type="audio/mp3">
    </audio>

    <!-- حاوية القلوب المتحركة -->
    <div class="hearts" id="hearts"></div>

    <!-- النصوص الرومانسية -->
    <div class="container">
        <h1>إلى من أحب ❤️</h1>
        <p>قد تبدو الأمور أحياناً كأنني لا أستمع جيداً... ولكنني أقسم أنني أفعل، أنا أهتم، وكنت دائماً أهتم.</p>
        <p>أنا أحبك أكثر من أي كلام، ولن أتركك أبداً، سأقف بجانبك في كل لحظة صعبة وكل عاصفة.</p>
        <p>أنت لست وحدك، فأنا معك — وبشكل دائم.</p>
                  <p><b>❤️💕love nesma </b></p>

    </div>

    <script>
        // دالة لتوليد القلوب العائمة بشكل مستمر
        function createHeart() {
            const heart = document.createElement("div");
            heart.classList.add("heart");
            heart.style.left = Math.random() * 100 + "vw";
            heart.style.animationDuration = (Math.random() * 3 + 3) + "s";
            document.getElementById("hearts").appendChild(heart);
            
            setTimeout(() => {
                heart.remove();
            }, 6000);
        }
        
        setInterval(createHeart, 300);
    </script>
</body>
</html>
